<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8">

<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}

#wrap{width:100%;max-width:960px;display:flex;flex-direction:column;gap:8px;padding:8px}
#cvw{position:relative;width:min(100%,max(280px,calc((100dvh - 270px)*16/9)));margin:0 auto;aspect-ratio:16/9;border:3px solid #3a1a24;border-radius:6px;overflow:hidden;background:#000}
canvas{width:100%;height:100%;image-rendering:pixelated;display:block}
#cvw::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(rgba(0,0,0,0) 50%,rgba(0,0,0,.25) 50%);background-size:100% 4px;box-shadow:inset 0 0 90px #000c}
#fx{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity .6s;z-index:3}
.shk{animation:shk .4s}@keyframes shk{0%,100%{transform:none}20%{transform:translate(-8px,5px)}40%{transform:translate(7px,-6px)}60%{transform:translate(-5px,-4px)}80%{transform:translate(4px,4px)}}
#dlg{min-height:150px;background:#0d0a10;border:3px solid #7a2a3e;border-radius:6px;padding:12px;cursor:pointer}
#who{color:#e0566f;margin-bottom:6px;min-height:20px}#txt{min-height:56px;color:#e9e2d2}
#ctl{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;align-items:center}
button,input{font:inherit;font-size:10px}
button{min-height:48px;padding:8px 14px;background:#2a0f1a;color:#f0e6d8;border:2px solid #b3263f;border-radius:6px;cursor:pointer;text-align:left}
button:active{background:#b3263f}.ch{border-color:#556;background:#14121a}
input[type=text],#ip{flex:1;min-width:180px;min-height:48px;background:#000;color:#e9e2d2;border:2px solid #556;border-radius:6px;padding:0 10px}
.sl{width:100%}#rg{width:100%;height:48px;accent-color:#e0566f}#pc{color:#e0566f;font-size:12px}
.nx{color:#e0566f;animation:bl 1s infinite}@keyframes bl{50%{opacity:0}}
#ctr{display:flex;gap:8px;justify-content:center}.pb{flex:1;max-width:300px;min-height:60px;text-align:center;font-size:12px;touch-action:none;transition:transform .08s,filter .08s}
.pb:active,.pb.dn{transform:scale(.93);filter:brightness(1.7);background:#b3263f}#bl,#br{display:none;align-items:center;justify-content:center;font-size:20px}
button:focus-visible{outline:3px solid #ffd34d}body{touch-action:manipulation;overscroll-behavior:none}
#fin{position:absolute;inset:0;z-index:4;display:none;flex-direction:column;justify-content:center;gap:10px;padding:4%;background:#12061ccc;overflow-y:auto;font-size:clamp(7px,1.5vw,11px);line-height:1.9;text-align:center}
#fin h2{color:#ffb7c9;font-size:1.5em;margin:0}#fin p{margin:0;opacity:0;animation:up 1.4s forwards}
#fin button{align-self:center;text-align:center}

</style></head><body>
<div id="wrap">
<div id="cvw"><canvas id="c" width="320" height="180"></canvas><div id="fx"></div><div id="fin"></div></div>
<div id="ctr"><button id="bl" class="pb">◀</button><button id="br" class="pb">▶</button><button id="ok" class="pb">▼ ENTER / TOCAR</button></div>
<div id="dlg"><div id="who"></div><div id="txt"></div><div id="ctl"></div></div>
</div>

<!-- Elemento de reproducción para el video cancion.mp4 -->
<video id="bgMusic" src="cancion.mp4" loop preload="auto" style="display:none;"></video>

<script>
const $=i=>document.getElementById(i),sleep=ms=>new Promise(r=>setTimeout(r,ms)),dlg=$('dlg'),g=$('c').getContext('2d');
let sc='title',T=0,wx=0,kw=0,tg=0,goal=null,res=null,ax=60,slx=200,sla=0,s2x=380,jx=240,sox=-80,portal=0,fin=0,flw=0,sit=0,ex='n',sp=0,spk='',face=1,gz=0,spark=0,kl=0;
const PETALS=Array.from({length:110},(_,i)=>({x:Math.random()*320,y:Math.random()*180,v:.25+Math.random()*.5,p:i}));

/* ---------- AUDIO Y REPRODUCCIÓN ---------- */
let A,mg,mus=null;
const bgMusic = $('bgMusic');

function au(){
    if(!A){
        A=new(window.AudioContext||window.webkitAudioContext)();
        mg=A.createGain();
        mg.gain.value=.5;
        mg.connect(A.destination);
    }
    if(A.state==='suspended') A.resume();
}

function tn(type,f,f2,d,v=.2,t=0){if(!A)return;const o=A.createOscillator(),gn=A.createGain(),s=A.currentTime+t;o.type=type;o.frequency.setValueAtTime(f,s);if(f2)o.frequency.exponentialRampToValueAtTime(f2,s+d);gn.gain.setValueAtTime(v,s);gn.gain.exponentialRampToValueAtTime(.001,s+d);o.connect(gn);gn.connect(mg);o.start(s);o.stop(s+d+.02)}
function nz(d,v){if(!A)return;const b=A.createBuffer(1,A.sampleRate*d,A.sampleRate),a=b.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1;const s=A.createBufferSource(),gn=A.createGain();s.buffer=b;gn.gain.setValueAtTime(v,A.currentTime);gn.gain.exponentialRampToValueAtTime(.001,A.currentTime+d);s.connect(gn);gn.connect(mg);s.start()}
const m2f=m=>440*Math.pow(2,(m-69)/12);
const coin=()=>{tn('square',988,0,.08,.15);tn('square',1319,0,.45,.15,.08)};
const sting=()=>{nz(.9,.5);tn('sawtooth',90,40,1,.3);tn('square',466,0,.9,.1);tn('square',493,0,.9,.1)};
const good=()=>[523,659,784,1047].forEach((f,i)=>tn('square',f,0,.15,.12,i*.08));
const bad=()=>{tn('square',220,110,.4,.15);tn('sawtooth',160,70,.4,.1)};
const whoosh=()=>{nz(.7,.35);tn('triangle',200,2200,.8,.1)};

/* ---------- MÚSICA ---------- */
const CH=[[57,60,64],[53,57,60],[60,64,67],[55,59,62]],ML=[[76,74,72,69],[77,76,74,72],[79,76,72,76],[74,71,67,74]];

function music(on){
    clearInterval(mus);
    mus=null;
    if(!on){
        bgMusic.pause();
        bgMusic.currentTime=0;
        return Promise.resolve(true);
    }

    au();
    // Reproduce cancion.mp4
    bgMusic.play().catch(e=>{
        console.log("No se pudo reproducir el archivo cancion.mp4, activando música sintetizada de respaldo.");
        let n=0,nt=A.currentTime+.1;
        mus=setInterval(()=>{while(nt<A.currentTime+.2){const b=(n>>3)&3,i=n&7,o=nt-A.currentTime;
         tn('square',m2f(CH[b][[0,1,2,1,0,1,2,1][i]]),0,.22,.05,o);if(i%2==0)tn('square',m2f(ML[b][i>>1]),0,.4,.07,o);if(i==0){tn('triangle',m2f(CH[b][0]-24),0,1.2,.16,o)}
         if(i%4==2)tn('triangle',m2f(CH[b][0]-12),0,.25,.1,o);n++;nt+=.33}},80);
    });
    return Promise.resolve(true);
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&A)A.resume()});

/* ---------- UI / DIÁLOGOS ---------- */
const V={AURORA:[520,'square'],SLENDERMAN:[90,'sawtooth'],'JEFF THE KILLER':[170,'square'],SONIC:[760,'square']};
function tap(){return new Promise(r=>{const f=e=>{if(e.type=='keydown'&&e.key!='Enter'&&e.key!=' ')return;dlg.removeEventListener('pointerdown',f);removeEventListener('keydown',f);r()};setTimeout(()=>{dlg.addEventListener('pointerdown',f);addEventListener('keydown',f)},180)})}
async function say(who,text,nw){$('who').textContent=who;$('ctl').innerHTML='';const el=$('txt');el.textContent='';let sk=0;const h=()=>sk=1;dlg.addEventListener('pointerdown',h);const v=V[who]||[300,'triangle'];spk=who;
 for(let i=0;i<text.length&&!sk;i++){el.textContent+=text[i];if(i%3==0)tn(v[1],v[0]*(1+Math.random()*.1),0,.05,.05);await sleep(26)}
 dlg.removeEventListener('pointerdown',h);spk='';el.textContent=text;if(nw)return;$('ctl').innerHTML='<span class=nx>▼ TOCA PARA SEGUIR</span>';await tap();$('ctl').innerHTML=''}
function choose(opts){return new Promise(r=>{const c=$('ctl');c.innerHTML='';opts.forEach((o,i)=>{const b=document.createElement('button');b.textContent=o;b.onclick=()=>{au();c.innerHTML='';r(i)};c.appendChild(b)});
 c.firstChild.focus();c.onkeydown=e=>{const b=[...c.children],i=b.indexOf(document.activeElement);if(e.key=='ArrowRight'||e.key=='ArrowDown'){e.preventDefault();b[(i+1)%b.length].focus()}if(e.key=='ArrowLeft'||e.key=='ArrowUp'){e.preventDefault();b[(i-1+b.length)%b.length].focus()}}})}
function slider(){return new Promise(r=>{$('ctl').innerHTML='<div class=sl><span id=pc>AMOR: 0%</span><input id=rg type=range min=0 max=100 step=5 value=0></div>';const rg=$('rg');let tm;rg.oninput=()=>$('pc').textContent='AMOR: '+rg.value+'%';rg.onchange=()=>{clearTimeout(tm);tm=setTimeout(()=>r(+rg.value),450)}})}
function ask(chips){return new Promise(r=>{const c=$('ctl');c.innerHTML='<input id=ip maxlength=60 placeholder="Escribe tu respuesta...">';const go=v=>{if(v.trim()){c.innerHTML='';r(v.trim())}};
 const ok=document.createElement('button');ok.textContent='RESPONDER';ok.onclick=()=>go($('ip').value);c.appendChild(ok);
 chips.forEach(t=>{const b=document.createElement('button');b.className='ch';b.textContent=t;b.onclick=()=>go(t);c.appendChild(b)});$('ip').onkeydown=e=>{if(e.key=='Enter')go(e.target.value)}})}
async function fade(col,ms=700){$('fx').style.background=col;$('fx').style.opacity=1;await sleep(ms)}
const unfade=()=>$('fx').style.opacity=0;
function shake(){const w=$('cvw');w.classList.remove('shk');void w.offsetWidth;w.classList.add('shk')}
function walkTo(n){$('bl').style.display=$('br').style.display='flex';return new Promise(r=>{goal=n;res=()=>{$('bl').style.display=$('br').style.display='none';kw=kl=0;r()}})}
const hold=(id,fn)=>{const b=$(id),on=e=>{e.preventDefault();au();b.classList.add('dn');fn(1);navigator.vibrate&&navigator.vibrate(8)},off=()=>{b.classList.remove('dn');fn(0)};b.addEventListener('pointerdown',on);['pointerup','pointerleave','pointercancel'].forEach(t=>b.addEventListener(t,off))};
hold('br',v=>kw=v);hold('bl',v=>kl=v);
$('ok').onclick=()=>{au();dlg.dispatchEvent(new Event('pointerdown'))};
addEventListener('keydown',e=>{const t=e.target.tagName;if(e.key==' '&&t!='INPUT'&&t!='BUTTON')e.preventDefault();if(t=='INPUT')return;if(e.key=='ArrowRight'||e.key=='d')kw=1;if(e.key=='ArrowLeft'||e.key=='a')kl=1});
addEventListener('keyup',e=>{if(e.key=='ArrowRight'||e.key=='d')kw=0;if(e.key=='ArrowLeft'||e.key=='a')kl=0});
addEventListener('gesturestart',e=>e.preventDefault());

/* ---------- PIXEL ART ---------- */
const R=(a,b,w,h,c)=>{g.fillStyle=c;g.fillRect(Math.round(a),Math.round(b),w,h)};
const HAIR='#0a0910',SK='#f8ebe3',BR='#4a2a18';
const FOG=Array.from({length:26},(_,i)=>({x:i*47%420,y:105+(i*13)%55,w:50+(i*17)%60,v:.15+(i%4)*.05,l:.3+(i%3)*.2}));
const MOTE=Array.from({length:22},(_,i)=>({x:(i*59)%340,y:60+(i*31)%90,p:i}));
function glow(x,y,c='255,205,110'){const r=7+Math.sin(T*.15)*2,gr=g.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,`rgba(${c},.85)`);gr.addColorStop(1,`rgba(${c},0)`);g.fillStyle=gr;g.fillRect(x-r,y-r,r*2,r*2);
 for(let i=0;i<4;i++){const a=T*.08+i*1.57,d=6+Math.sin(T*.2+i)*2;R(x+Math.cos(a)*d,y+Math.sin(a)*d,1,1,'#fff6c0')}}
function flower(x,y){R(x+2,y+3,1,5,'#2d7a2d');R(x+1,y,3,3,'#e0356a');R(x+2,y-1,1,1,'#e0356a');R(x+2,y+1,1,1,'#ffd34d')}
function aurora(x,y,mv){
 const f=(T>>3)&3,bob=mv?(f&1?-1:0):(Math.sin(T*.07)>0?0:-1),sw=mv?[-2,0,2,0][f]:0,ty=y-25+bob,cx=x,sy=Math.round(Math.sin(T*.05)),
  e=(spk=='AURORA'&&((T>>2)&1)&&ex=='n')?'talk':ex;
 g.save();if(face<0){g.translate(cx,0);g.scale(-1,1);g.translate(-cx,0)}
 R(cx-5,ty+3,10,10,HAIR);R(cx-5+sy,ty+13,2,2,HAIR);R(cx-1,ty+13,2,3,HAIR);R(cx+3-sy,ty+13,2,2,HAIR);R(cx-6,ty+2,12,4,HAIR);R(cx-5,ty,10,3,HAIR);R(cx-3,ty-1,5,1,HAIR);R(cx+4,ty-1,2,2,HAIR);
 R(cx-4,ty+5,8,7,SK);R(cx-1,ty+12,2,1,SK);
 R(cx-5,ty+5,2,7,HAIR);R(cx+3,ty+5,2,7,HAIR);R(cx-6,ty+11,1,3,HAIR);R(cx+5,ty+11,1,2,HAIR);R(cx-4,ty+4,4,2,HAIR);R(cx+1,ty+4,3,1,HAIR);R(cx,ty+5,1,1,HAIR);
 const eye=u=>{
  if(e=='sur'){R(u-1,ty+6,4,5,'#fff');R(u,ty+7,2,3,BR);R(u,ty+7,1,1,'#fff')}
  else if(e=='smile'||e=='joy'){R(u,ty+8,1,1,'#000');R(u+1,ty+7,1,1,'#000');if(e=='joy'){R(u-1,ty+5,1,1,'#ffd34d');R(u+2,ty+6,1,1,'#ffd34d')}}
  else if(T%220<7)R(u,ty+8,2,1,'#000');
  else{R(u,ty+6,2,1,'#000');R(u,ty+7,2,3,BR);R(u,ty+7,1,1,'#fff');R(u+1,ty+9,1,1,'#2a150a')}};
 eye(cx-3);eye(cx+1);
 if(e=='smile'||e=='joy'){R(cx-4,ty+10,2,1,'#f2a0a8');R(cx+2,ty+10,2,1,'#f2a0a8')}
 if(e=='sur')R(cx-1,ty+10,2,2,'#6a1a1a');
 else if(e=='joy'){R(cx-2,ty+10,4,2,'#6a1a1a');R(cx-1,ty+11,2,1,'#e55')}
 else if(e=='smile'){R(cx-2,ty+10,4,1,'#c44');R(cx-1,ty+11,2,1,'#c44')}
 else if(e=='talk')R(cx-1,ty+10,2,2,'#7a2a2a');else R(cx-1,ty+11,2,1,'#b05050');
 const J='#3a2440';R(cx-3,ty+13,6,6,J);R(cx-2,ty+13,4,1,'#6a4a7a');
 R(cx-5,ty+13+(sw>0?0:1),2,5,J);R(cx+3,ty+13+(sw<0?0:1),2,5,J);R(cx-5,ty+18+(sw>0?0:1),2,1,SK);R(cx+3,ty+18+(sw<0?0:1),2,1,SK);R(cx-3,ty+19,6,3,'#1a1522');
 const a=sw>>1;R(cx-3+a,y-3,2,2,'#1a1522');R(cx+1-a,y-3,2,2,'#1a1522');R(cx-3+a,y-1,3,1,'#0a0a0a');R(cx+1-a,y-1,3,1,'#0a0a0a');
 if(flw){flower(cx+5,ty+11);glow(cx+6,ty+13)}
 g.restore()}
function slender(x,y,a){if(a<=0)return;const yy=y-3+Math.sin(T*.05)*2.5;g.globalAlpha=a*.25;g.fillStyle='#500';g.beginPath();g.arc(x,yy-24,26+Math.sin(T*.07)*2,0,6.3);g.fill();g.globalAlpha=a;
 for(let i=0;i<4;i++){const d=i<2?-1:1;for(let j=0;j<9;j++)R(x+d*(4+j*2),yy-32+i%2*7+Math.sin(T*.08+j*.6+i)*3+j,2,1,'#111')}
 x+=a<1?(Math.random()-.5)*4:0;R(x-3,yy-34,7,34,'#0a0a0a');R(x-5,yy-32,2,28,'#0a0a0a');R(x+4,yy-32,2,28,'#0a0a0a');R(x-3,yy-44,7,9,'#e8e8e8');R(x,yy-33,1,10,'#a00');
 if(a<1)for(let i=0;i<14;i++)R(x-10+Math.random()*20,yy-46+Math.random()*48,2+Math.random()*8,1,Math.random()>.5?'#fff':'#000');g.globalAlpha=1}
function jeff(x,y){const tk=spk=='JEFF THE KILLER',b=Math.sin(T*.06)>0?0:1;let dx=tk?Math.round(Math.sin(T*.4)):0;if(gz>0){dx+=Math.round(Math.sin(T*.3)*2);gz--}
 const hy=y-34+b,hx=x+dx;R(x-6,y-22+b,12,14,'#e9e9e9');R(x-8,y-21+b,2,10,'#e9e9e9');R(x+6,y-21+b,2,10,'#e9e9e9');R(x-5,y-8,4,8,'#334');R(x+1,y-8,4,8,'#334');
 R(hx-6,hy,12,16,'#0a0a0a');R(hx-4,hy+2,8,10,'#f4f4f4');
 if(T%260<8){R(hx-3,hy+5,2,1,'#000');R(hx+1,hy+5,2,1,'#000')}else{R(hx-3,hy+4,2,3,'#000');R(hx+1,hy+4,2,3,'#000');R(hx-3,hy+3,2,1,'#555');R(hx+1,hy+3,2,1,'#555')}
 R(hx-4,hy+9,8,1,'#b00');R(hx-4,hy+8,1,1,'#b00');R(hx+3,hy+8,1,1,'#b00');if(tk&&(T>>3)&1)R(hx-3,hy+10,6,1,'#b00')}
function sonic(x,y,run,fl_,spin){g.save();if(fl_){g.translate(x,0);g.scale(-1,1);g.translate(-x,0)}const B='#1e5bd8',t='#f3d6b0';
 const body=xx=>{if(spin){g.fillStyle=B;g.beginPath();g.arc(xx,y-9,8,0,6.3);g.fill();g.strokeStyle='#8cf';g.lineWidth=1.5;for(let k=0;k<3;k++){g.beginPath();g.arc(xx,y-9,5,T*.6+k*2.1,T*.6+k*2.1+1.1);g.stroke()}return}
  R(xx-9,y-19,5,3,B);R(xx-8,y-15,4,3,B);R(xx-8,y-11,3,3,B);R(xx-5,y-20,11,10,B);R(xx-4,y-11,8,8,B);R(xx-1,y-9,4,5,t);R(xx+2,y-15,5,4,t);R(xx,y-18,3,4,'#fff');R(xx+1,y-17,1,2,'#000');R(xx+6,y-15,1,1,'#000');
  const l=run?(T>>1)&1:Math.round(Math.sin(T*.1));R(xx-4+l*2,y-3,5,3,'#d22');R(xx+2-l*2,y-3,5,3,'#d22')};
 if(run){for(let i=3;i>0;i--){g.globalAlpha=.13*(4-i);body(x-i*9)}g.globalAlpha=1;for(let i=0;i<4;i++)R(x-28-i*13,y-16+i*4,14,1,'rgba(160,210,255,.6)')}
 body(x);g.restore()}
function tree(x,h,c){const w_=Math.sin(T*.02+x*.07)*1.5;R(x,150-h*.45,3,h*.45,c);for(let i=0;i<4;i++){const w=22-i*5;R(x+1-w/2+w_*(i+1)*.3,150-h*.45-i*11-8,w,11,c)}}
function sakura(x,y){R(x,y,5,150-y,'#2a1810');R(x-6,y+20,8,2,'#2a1810');const w_=Math.sin(T*.02+x)*2;for(let k=0;k<20;k++){const cx=x+2+((k*37)%56)-28+w_*(k%3)*.4,cy=y-4-((k*23)%32),r=8+k%3*3;g.fillStyle=['#f7a8c0','#ffc9d9','#e88aa8'][k%3];g.beginPath();g.arc(cx,cy,r,0,6.3);g.fill()}}
function sky(a,b){const gr=g.createLinearGradient(0,0,0,150);gr.addColorStop(0,a);gr.addColorStop(1,b);g.fillStyle=gr;g.fillRect(0,0,320,180)}
function drawForest(mv){sky('#05060d','#1a1030');for(let i=0;i<40;i++)R((i*83)%320,(i*37)%80,1,1,(T+i*9)%60<4?'#fff':'#aab');g.fillStyle='#e8e4d0';g.beginPath();g.arc(255,32,13,0,6.3);g.fill();
 g.fillStyle='#0c0a1a';g.beginPath();g.moveTo(0,150);for(let i=0;i<=32;i++)g.lineTo(i*10,112-Math.sin((i*10+wx*.1)*.04)*12-Math.sin((i*10+wx*.1)*.11)*5);g.lineTo(320,150);g.fill();
 [[.3,'#0a1210',80],[.7,'#050a08',100]].forEach(([p,c,h])=>{for(let k=0;k<10;k++)tree(((k*47-wx*p)%480+480)%480-40,h+(k*13)%30,c)});
